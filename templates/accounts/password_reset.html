{% extends 'base.html' %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-5">
                    <h3 class="text-center mb-4">🌾 Reset Password</h3>
                    <p class="text-muted text-center mb-4">Enter your email and we'll send you reset instructions.</p>
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <input type="email" name="email" class="form-control form-control-lg" placeholder="your@email.com" required>
                        </div>
                        <button type="submit" class="btn btn-success btn-lg w-100">Send Reset Link</button>
                    </form>
                    <p class="text-center mt-4"><a href="{% url 'login' %}">Back to Login</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
