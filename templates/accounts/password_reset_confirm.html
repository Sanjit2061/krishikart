{% extends 'base.html' %}
{% block title %}Set New Password{% endblock %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-5">
                    <h3 class="text-center mb-4">🌾 Set New Password</h3>
                    {% if validlink %}
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold">New Password</label>
                            <input type="password" name="new_password1" class="form-control form-control-lg" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Confirm New Password</label>
                            <input type="password" name="new_password2" class="form-control form-control-lg" required>
                        </div>
                        <button type="submit" class="btn btn-success btn-lg w-100">Reset Password</button>
                    </form>
                    {% else %}
                    <p class="text-danger text-center">This reset link is invalid or has expired.</p>
                    <a href="{% url 'password_reset' %}" class="btn btn-success rounded-pill">Request a new link</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
