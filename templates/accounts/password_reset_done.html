{% extends 'base.html' %}
{% block title %}Check Your Email{% endblock %}
{% block content %}
<div class="container mt-5 text-center">
    <i class="fas fa-envelope-open-text fa-4x text-success mb-4"></i>
    <h3>Check your email</h3>
    <p class="text-muted">We've sent password reset instructions. Since this is a test environment, check your <strong>terminal console</strong> (where <code>runserver</code> is running) for the reset link.</p>
    <a href="{% url 'login' %}" class="btn btn-success rounded-pill mt-3">Back to Login</a>
</div>
{% endblock %}
