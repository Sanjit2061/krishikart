{% extends 'base.html' %}
{% block title %}Contact Us{% endblock %}
{% block content %}
<div class="container my-5">
    <h2 class="text-center mb-2">Contact <span class="text-success">Us</span></h2>
    <p class="text-muted text-center mb-5">We'd love to hear from you.</p>
    <div class="row g-4 justify-content-center">
        <div class="col-md-4">
            <div class="bg-white rounded-4 shadow-sm p-4 text-center h-100">
                <i class="fas fa-envelope fa-2x text-success mb-3"></i>
                <h6 class="fw-bold">Email</h6>
                <p class="text-muted mb-0">support@krishikart.com</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="bg-white rounded-4 shadow-sm p-4 text-center h-100">
                <i class="fas fa-phone fa-2x text-success mb-3"></i>
                <h6 class="fw-bold">Phone</h6>
                <p class="text-muted mb-0">+977-1-XXXXXXX</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="bg-white rounded-4 shadow-sm p-4 text-center h-100">
                <i class="fas fa-map-marker-alt fa-2x text-success mb-3"></i>
                <h6 class="fw-bold">Address</h6>
                <p class="text-muted mb-0">Lalitpur, Nepal</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
